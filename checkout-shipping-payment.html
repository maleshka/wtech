<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping & Payment</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="h3 fw-bold mb-4">Shipping & Payment</h1>
    <div class="row g-5">
      <div class="col-lg-7">
        <h2 class="h4 mb-3">Method of delivery</h2>
        <div class="vstack gap-3 mb-5">
          <label class="border rounded p-3 d-flex justify-content-between align-items-center">
            <span><input type="radio" name="shipping" checked> Courier (DPD / GLS)</span>
            <strong>€4.90</strong>
          </label>
          <label class="border rounded p-3 d-flex justify-content-between align-items-center">
            <span><input type="radio" name="shipping"> Express shipping</span>
            <strong>€9.90</strong>
          </label>
          <label class="border rounded p-3 d-flex justify-content-between align-items-center">
            <span><input type="radio" name="shipping"> Parcel box</span>
            <strong>€2.90</strong>
          </label>
        </div>

        <h2 class="h4 mb-3">Method of payment</h2>
        <div class="vstack gap-3">
          <label class="border rounded p-3"><input type="radio" name="payment" checked> Payment card</label>
          <label class="border rounded p-3"><input type="radio" name="payment"> PayPal</label>
          <label class="border rounded p-3"><input type="radio" name="payment"> Cash on delivery</label>
          <label class="border rounded p-3"><input type="radio" name="payment"> Apple Pay / Google Pay</label>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h2 class="h4 mb-4">Your order</h2>
            <div id="checkoutSummary"></div>
            <hr>
            <div class="d-flex justify-content-between"><span>Subtotal</span><strong>$186.00</strong></div>
            <div class="d-flex justify-content-between"><span>Shipping</span><strong>€4.90</strong></div>
            <div class="d-flex justify-content-between fs-5 fw-bold mt-3"><span>Total</span><span>$190.90</span></div>
          </div>
        </div>
        <a href="checkout-delivery.html" class="btn btn-warning w-100 mt-4">Continue to delivery details</a>
      </div>
    </div>
  </main>
</body>
</html>
