<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm border-0" style="max-width: 560px; width: 100%;">
    <div class="card-body p-4 p-md-5">
      <ul class="nav nav-tabs mb-4">
        <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
        <li class="nav-item"><a class="nav-link active" href="register.html">Registration</a></li>
      </ul>

      <form id="registerForm" class="row g-3">
        <div class="col-md-6"><input class="form-control" placeholder="First name" required></div>
        <div class="col-md-6"><input class="form-control" placeholder="Last name" required></div>
        <div class="col-12"><input type="email" class="form-control" placeholder="E-mail" required></div>
        <div class="col-12"><input type="password" class="form-control" placeholder="Password" required></div>
        <div class="col-12"><input type="password" class="form-control" placeholder="Repeat password" required></div>
        <div class="col-12"><button class="btn btn-dark btn-lg w-100">Sign up</button></div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
