<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping cart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-5">
    <div class="small text-secondary mb-4">Home / Shopping cart</div>
    <h1 class="h2 fw-bold mb-4">My cart</h1>

    <div class="row g-4">
      <div class="col-lg-8">
        <div id="cartItems" class="vstack gap-3"></div>
      </div>

      <div class="col-lg-4">
        <div class="card shadow-sm border-0">
          <div class="card-body">
            <h2 class="h3 mb-4">Order summary</h2>
            <div class="d-flex justify-content-between mb-2">
              <span>Subtotal</span>
              <strong id="subtotal">$0.00</strong>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span>Shipping</span>
              <strong>—</strong>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <span>Discount</span>
              <strong>—</strong>
            </div>
            <hr>
            <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
              <span>Total</span>
              <span id="total">$0.00</span>
            </div>

            <div class="input-group mb-3">
              <input type="text" class="form-control" placeholder="Promo code">
              <button class="btn btn-outline-secondary">Confirm</button>
            </div>

            <a href="checkout-shipping-payment.html" class="btn btn-warning w-100">Continue</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/cart.js"></script>
</body>
</html>
