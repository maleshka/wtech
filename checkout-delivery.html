<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivery details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="h3 fw-bold mb-4">Delivery details</h1>
    <div class="row g-5">
      <div class="col-lg-7">
        <form id="deliveryForm" class="row g-3">
          <h2 class="h4 mt-0">Contact details</h2>
          <div class="col-md-6"><input class="form-control" placeholder="First name" required></div>
          <div class="col-md-6"><input class="form-control" placeholder="Last name" required></div>
          <div class="col-md-6"><input type="email" class="form-control" placeholder="E-mail" required></div>
          <div class="col-md-6"><input class="form-control" placeholder="Phone" required></div>

          <h2 class="h4 mt-4">Delivery address</h2>
          <div class="col-12"><input class="form-control" placeholder="Street and house number" required></div>
          <div class="col-md-6"><input class="form-control" placeholder="City" required></div>
          <div class="col-md-6"><input class="form-control" placeholder="Postal" required></div>
          <div class="col-md-6"><input class="form-control" placeholder="Region"></div>
          <div class="col-md-6"><input class="form-control" placeholder="Country" required></div>
          <div class="col-12"><textarea class="form-control" rows="4" placeholder="Order note (optional)"></textarea></div>
        </form>
      </div>

      <div class="col-lg-5">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h2 class="h3 mb-4">Summary</h2>
            <div class="d-flex justify-content-between"><span>Subtotal</span><strong>$186.00</strong></div>
            <div class="d-flex justify-content-between"><span>Shipping</span><strong>$4.90</strong></div>
            <div class="d-flex justify-content-between"><span>Discount</span><strong>—</strong></div>
            <hr>
            <div class="d-flex justify-content-between fs-5 fw-bold"><span>Total</span><span>$190.90</span></div>
          </div>
        </div>
        <button class="btn btn-warning w-100 mt-4" id="completeOrderBtn">Complete order</button>
      </div>
    </div>
  </main>

  <script src="js/checkout.js"></script>
</body>
</html>
